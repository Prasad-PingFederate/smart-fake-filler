<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    h3 { margin: 0 0 12px 0; font-size: 16px; color: #1a1a1a; }
    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #fillBtn { background: #e74c3c; color: white; }
    #clearBtn { background: #ecf0f1; color: #2c3e50; }
    .hint { font-size: 12px; color: #7f8c8d; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h3>Smart Fake Filler</h3>
  <button id="fillBtn">Fill Form Smartly</button>
  <button id="clearBtn">Clear All Fields</button>
  <div class="hint">Shortcut: Ctrl/Cmd + Shift + F. Refresh the tab once after installing.</div>
  <script src="popup.js"></script>
</body>
</html>
